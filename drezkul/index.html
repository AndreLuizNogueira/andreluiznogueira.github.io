<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/drezkul/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Drezkul: FPS retrô com bots, times, rede local e editor de mapas">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Drezkul">
  <meta name="theme-color" content="#070B14">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Drezkul</title>
  <link rel="manifest" href="manifest.json">

  <!-- A página é só o jogo: sem zoom, rolagem nem "puxar para atualizar".
       Com zoom de pinça (o Chrome deixa forçar nas opções de acessibilidade),
       o jogo encolhia e sobrava uma faixa branca sem jeito de voltar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #070B14;
    }
  </style>
</head>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      var wantLock = false;
      var moveCb = null;
      var skipFrames = 0;

      function lockTarget() {
        return document.documentElement;
      }

      function requestLock() {
        var el = lockTarget();
        if (!el || !el.requestPointerLock) return;
        var result = el.requestPointerLock();
        if (result && result.catch) result.catch(function () {});
      }

      window.drezkulSetWantPointerLock = function (want) {
        wantLock = !!want;
      };
      window.drezkulLockPointer = function () {
        requestLock();
      };
      window.drezkulUnlockPointer = function () {
        if (document.exitPointerLock) document.exitPointerLock();
      };
      window.drezkulIsPointerLocked = function () {
        return !!document.pointerLockElement;
      };
      window.drezkulSetPointerLockChangeCallback = function (cb) {
        document.addEventListener('pointerlockchange', function () {
          if (document.pointerLockElement) {
            // Ignora os primeiros frames após o bloqueio, pois navegadores baseados em Chromium
            // reportam a distância entre a posição anterior do cursor e o centro da tela como delta.
            skipFrames = 3;
          }
          cb();
        });
      };
      window.drezkulSetPointerMoveCallback = function (cb) {
        moveCb = cb;
      };
      var clickCb = null;
      window.drezkulSetPointerClickCallback = function (cb) {
        clickCb = cb;
      };

      // Capture no gesto do clique — Flutter chama requestPointerLock tarde demais.
      // E quando o Pointer Lock está ativo, o navegador direciona os cliques diretamente ao document.documentElement,
      // fazendo com que o Flutter Web perca os eventos no widget tree.
      document.addEventListener('mousedown', function (event) {
        if (!wantLock) return;
        // mousedown de compatibilidade vindo de um toque: não há mouse para travar.
        if (event.sourceCapabilities && event.sourceCapabilities.firesTouchEvents) return;
        if (!document.pointerLockElement && event.button === 0) requestLock();
      }, true);

      // Cliques com o ponteiro travado, pelos botões do evento de ponteiro: o
      // esquerdo apertado com o direito já pressionado (mirando) só gera
      // pointermove, e o tiro não saía.
      var lastButtons = 0;
      function trackClicks(event) {
        if (event.pointerType && event.pointerType !== 'mouse') return;
        var pressed = event.buttons & ~lastButtons;
        lastButtons = event.buttons;
        if (!document.pointerLockElement || !clickCb || !wantLock) return;
        // Bits dos botões → número do botão (1: esquerdo = 0, 2: direito = 2, 4: meio = 1).
        var map = [[1, 0], [4, 1], [2, 2]];
        for (var i = 0; i < map.length; i++) {
          if (pressed & map[i][0]) {
            try {
              clickCb(map[i][1]);
            } catch (e) {
              console.error('[drezkul] clickCb error:', e);
            }
          }
        }
      }
      document.addEventListener('pointerdown', trackClicks, true);
      document.addEventListener('pointermove', trackClicks, true);
      document.addEventListener('pointerup', trackClicks, true);

      // Mira: botão direito segurado. Pelos botões do evento de ponteiro,
      // porque apertar um segundo botão com outro já apertado só gera
      // pointermove (e com o ponteiro travado o Flutter não vê os cliques).
      window.drezkulAimHeld = false;
      function trackAim(event) {
        if (event.pointerType && event.pointerType !== 'mouse') return;
        window.drezkulAimHeld = (event.buttons & 2) !== 0;
      }
      document.addEventListener('pointerdown', trackAim, true);
      document.addEventListener('pointermove', trackAim, true);
      document.addEventListener('pointerup', trackAim, true);
      window.addEventListener('blur', function () {
        window.drezkulAimHeld = false;
      });
      // O botão direito é a mira: sem o menu de contexto do navegador.
      document.addEventListener('contextmenu', function (event) {
        event.preventDefault();
      });

      // O Flutter troca o viewport por um que deixa dar zoom até 5x; aqui ele
      // volta a ser o sem zoom (o jogo encolhia e sobrava uma faixa branca).
      var VIEWPORT = 'width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
      function applyViewport() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta && meta.getAttribute('content') !== VIEWPORT) meta.setAttribute('content', VIEWPORT);
      }
      new MutationObserver(applyViewport).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
      window.addEventListener('flutter-first-frame', applyViewport);

      // Se a página ainda assim levar zoom ou rolar, volta ao normal: reescrever
      // o viewport faz o navegador voltar à escala 1.
      function resetZoom() {
        var vv = window.visualViewport;
        if (vv && Math.abs(vv.scale - 1) > 0.01) {
          var meta = document.querySelector('meta[name="viewport"]');
          if (meta) {
            var content = meta.getAttribute('content');
            meta.setAttribute('content', content + ', ');
            setTimeout(function () { meta.setAttribute('content', content); }, 50);
          }
        }
        if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
      }
      if (window.visualViewport) window.visualViewport.addEventListener('resize', resetZoom);
      window.addEventListener('scroll', resetZoom);
      window.addEventListener('orientationchange', resetZoom);

      document.addEventListener('mousemove', function (event) {
        if (!document.pointerLockElement || !moveCb) return;
        if (skipFrames > 0) {
          skipFrames--;
          return;
        }
        var mx = event.movementX;
        var my = event.movementY;
        if (typeof mx !== 'number') mx = 0;
        if (typeof my !== 'number') my = 0;

        // Descarta apenas saltos artificiais de teleporte de cursor do Chromium (> 500px num único frame)
        if (Math.abs(mx) > 500 || Math.abs(my) > 500) {
          return;
        }

        // Suaviza a velocidade vertical para evitar saltos bruscos no pitch,
        // permitindo movimento lateral rápido e sem barreira.
        my = Math.max(-30, Math.min(30, my));

        moveCb(mx, my);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
